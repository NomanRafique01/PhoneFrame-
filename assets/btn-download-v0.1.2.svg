<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 74" width="300" height="74" role="img" aria-label="Download PhoneFrame v0.1.2 for Windows x64">
  <defs>
    <linearGradient id="pf-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCD0CF"/>
      <stop offset="55%" stop-color="#5FBF9A"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="pf-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101B24"/>
      <stop offset="100%" stop-color="#06141B"/>
    </linearGradient>
    <linearGradient id="pf-tag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5FBF9A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="pf-tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#B8C4CE"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="296" height="70" rx="14" fill="url(#pf-bg)" stroke="url(#pf-border)" stroke-width="2"/>
  <rect x="3.1" y="3.1" width="293.8" height="67.8" rx="13" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>

  <!-- App icon tile: pure SVG phone silhouette (GitHub CSP compliant — no <image> tag) -->
  <rect x="18" y="17" width="40" height="40" rx="11" fill="url(#pf-tile)"/>
  <!-- Phone body -->
  <rect x="27" y="21" width="22" height="32" rx="4" fill="#1a1a24" stroke="#8AE6C4" stroke-width="1.5"/>
  <!-- Screen -->
  <rect x="30" y="26" width="16" height="20" rx="2" fill="#8AE6C4" fill-opacity="0.18"/>
  <!-- Camera notch -->
  <circle cx="38" cy="23.5" r="1.2" fill="#8AE6C4" fill-opacity="0.55"/>
  <!-- Home bar -->
  <rect x="34" y="50" width="8" height="1.5" rx="0.75" fill="#8AE6C4" fill-opacity="0.6"/>

  <rect x="72" y="10" width="94" height="16" rx="8" fill="url(#pf-tag)" stroke="#8AE6C4" stroke-width="0.8" stroke-opacity="0.65"/>
  <text x="119" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8" fill="#8AE6C4" text-anchor="middle">LATEST STABLE</text>

  <text x="72" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">PhoneFrame v0.1.2</text>
  <text x="72" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#9BA8AB">Windows 10/11 x64 • 88 MB</text>

  <g transform="translate(248, 23)">
    <circle cx="14" cy="14" r="14" fill="#5FBF9A" fill-opacity="0.14" stroke="#8AE6C4" stroke-width="1.2"/>
    <path d="M14 7v10M9.5 12.5L14 17l4.5-4.5M8 20h12" fill="none" stroke="#8AE6C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
